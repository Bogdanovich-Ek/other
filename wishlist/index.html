<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Мой вишлист — что подарить: описания и ссылки">
  <title>Мой вишлист</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0b0d'/><text x='50' y='72' font-size='62' text-anchor='middle' fill='%23ff2e3f'>&#9829;</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="hero-eyebrow">Wishlist · список желаний</p>
      <h1 class="hero-title">Мой <span class="accent">вишлист</span></h1>

      <!-- ✏️ ВПИШИТЕ СВОЙ ТЕКСТ: это личный комментарий на главной странице -->
      <p class="hero-comment">
        Спасибо, что заглянули! Здесь собрано то, что меня точно порадует.
        Выбирайте любой пункт — промахов здесь не бывает ♥
      </p>

      <p class="hero-divider" aria-hidden="true">✦ ✦ ✦</p>
    </header>

    <main>
      <div class="toolbar">
        <p class="counter" id="stats"></p>
        <button class="btn-red" id="addBtn" type="button">＋ Добавить пункт</button>
      </div>

      <section class="list" id="giftList" aria-live="polite" aria-label="Список подарков"></section>
    </main>

    <footer class="site-footer">
      <span>сделано с <span class="heart">♥</span></span>
      <button class="text-btn" id="resetBtn" type="button">Сбросить список</button>
    </footer>
  </div>

  <!-- Модальное окно добавления / редактирования пункта -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Новый пункт</h2>
      <form id="giftForm">
        <label class="field">
          Название *
          <input id="fName" maxlength="80" placeholder="Например: наушники Sony WH-1000XM5" required>
        </label>

        <label class="field">
          Описание
          <textarea id="fDesc" rows="3" maxlength="500" placeholder="Какой именно: цвет, модель, комплектация, где продаётся…"></textarea>
        </label>

        <div class="form-row">
          <label class="field">
            Цена
            <input id="fPrice" maxlength="40" placeholder="напр. до 10 000 ₽">
          </label>
          <label class="field">
            Ссылка
            <input id="fLink" type="url" placeholder="https://…">
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-ghost" id="cancelBtn">Отмена</button>
          <button type="submit" class="btn-red">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="script.js" defer></script>
</body>
</html>
